
name: Build ImmortalWrt for Hisense HNR101

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Clean build (disable compilation cache)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hnr101-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: HNR101 Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      REPO_URL: https://github.com/sqliuchang/immortalwrt.git
      REPO_COMMIT: af7729479ddf19fecac5872fb89344958832ab12
      TZ: Asia/Shanghai

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-distutils \
            python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl \
            cpio ecj fastjar java-propose-classpath \
            libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev \
            libreadline-dev libtool libyaml-dev \
            patch pkgconf qemu-utils squashfs-tools \
            subversion swig time xsltproc zstd

      - name: Clone HNR101-capable ImmortalWrt source
        run: |
          git clone --depth 1 \
            https://github.com/sqliuchang/immortalwrt.git \
            immortalwrt

          cd immortalwrt

          # Fetch and pin the exact HNR101 support commit.
          git fetch --depth 1 origin "$REPO_COMMIT"
          git checkout --detach "$REPO_COMMIT"

          echo "Source commit:"
          git log -1 --oneline

      - name: Verify HNR101 device support
        run: |
          cd immortalwrt

          test -f target/linux/qualcommax/dts/ipq8072-hnr101.dts
          test -f target/linux/qualcommax/image/ipq807x.mk
          test -f package/firmware/ipq-wifi/src/board-hisense_hnr101.ipq8074

          grep -n -i -A 15 -B 3 'hisense_hnr101' \
            target/linux/qualcommax/image/ipq807x.mk || true

          echo "HNR101 device files found."

      - name: Update and install feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate HNR101 configuration
        run: |
          cd immortalwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_ethtool=y

          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-nls-utf8=y
          EOF

          make defconfig

          echo "Checking target configuration..."
          grep -E '^CONFIG_TARGET_(qualcommax|DEVICE_qualcommax)' .config

          grep -qx \
            'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y' \
            .config || {
              echo "ERROR: HNR101 target profile is not enabled."
              exit 1
            }

      - name: Download sources
        run: |
          cd immortalwrt
          make download -j2
        timeout-minutes: 120

      - name: Compile firmware
        run: |
          cd immortalwrt

          echo "CPU threads: $(nproc)"
          echo "Starting HNR101 build..."

          make -j2 V=s
        timeout-minutes: 300

      - name: Verify firmware output
        if: success()
        run: |
          cd immortalwrt

          echo "Generated image files:"
          find bin/targets/qualcommax/ipq807x \
            -maxdepth 2 -type f \
            \( -name '*.bin' -o \
               -name '*.ubi' -o \
               -name '*.img' -o \
               -name '*.itb' -o \
               -name '*.tar' -o \
               -name '*.manifest' -o \
               -name '*.json' \) \
            -print

          test -n "$(find bin/targets/qualcommax/ipq807x \
            -type f \( -name '*.bin' -o -name '*.ubi' \
            -o -name '*.img' -o -name '*.itb' \) -print -quit)" || {
              echo "ERROR: No firmware image found."
              exit 1
            }

      - name: Save build configuration
        if: always()
        run: |
          mkdir -p build-info
          if [ -f immortalwrt/.config ]; then
            cp immortalwrt/.config build-info/config.txt
          fi
          if [ -d immortalwrt/bin/targets/qualcommax/ipq807x ]; then
            cp immortalwrt/bin/targets/qualcommax/ipq807x/*.manifest \
              build-info/ 2>/dev/null || true
            cp immortalwrt/bin/targets/qualcommax/ipq807x/sha256sums \
              build-info/ 2>/dev/null || true
          fi
          git -C immortalwrt rev-parse HEAD \
            > build-info/source-commit.txt 2>/dev/null || true

      - name: Upload HNR101 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-HNR101-${{ github.run_number }}
          path: |
            immortalwrt/bin/targets/qualcommax/ipq807x/
            build-info/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HNR101-build-diagnostics-${{ github.run_number }}
          path: |
            immortalwrt/.config
            immortalwrt/logs/
            build-info/
          if-no-files-found: ignore
          retention-days: 7
