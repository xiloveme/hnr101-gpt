name: ImmortalWrt HNR101 Minimal Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hnr101-build.yml"
  schedule:
    - cron: "0 18 * * 5"

permissions:
  contents: read

concurrency:
  group: hnr101-immortalwrt-build
  cancel-in-progress: false

jobs:
  build:
    name: Build HNR101 Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ack asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang \
            cmake cpio curl device-tree-compiler flex gawk \
            gettext git gnutls-dev gperf libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev \
            libz-dev lld llvm make patch perl python3 \
            python3-setuptools qemu-utils rsync unzip wget \
            xsltproc zlib1g-dev file findutils jq

      - name: Checkout ImmortalWrt source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/sqliuchang/immortalwrt.git immortalwrt
          cd immortalwrt
          git checkout af7729479ddf19fecac5872fb89344958832ab12

          echo "=== Source revision ==="
          git log -1 --oneline
          test "$(git rev-parse HEAD)" = \
            "af7729479ddf19fecac5872fb89344958832ab12"

      - name: Check HNR101 target support
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail

          test -f target/linux/qualcommax/dts/ipq8072-hnr101.dts || {
            echo "::error::HNR101 DTS file not found."
            exit 1
          }

          grep -q 'hisense_hnr101' \
            target/linux/qualcommax/image/ipq807x.mk || {
              echo "::error::HNR101 image definition not found."
              exit 1
          }

      - name: Update package feeds
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail

          # Remove third-party iStore/OpenClash feed entries if present.
          for f in feeds.conf feeds.conf.default; do
            if [ -f "$f" ]; then
              sed -i \
                -e '/istore/d' \
                -e '/openclash/d' \
                "$f"
            fi
          done

          ./scripts/feeds update -a

      - name: Install minimal LuCI packages
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds install luci

          if find package feeds -type f \
            -path '*/luci-app-package-manager/Makefile' \
            -print -quit 2>/dev/null | grep -q .; then
            ./scripts/feeds install luci-app-package-manager
            echo "PACKAGE_MANAGER_UI=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::luci-app-package-manager not found in this source."
            echo "PACKAGE_MANAGER_UI=no" >> "$GITHUB_ENV"
          fi

          if find package feeds -type f \
            -path '*/luci-i18n-base-zh-cn/Makefile' \
            -print -quit 2>/dev/null | grep -q .; then
            echo "CHINESE_PACKAGE=luci-i18n-base-zh-cn" >> "$GITHUB_ENV"
          elif find package feeds -type f \
            -path '*/luci-i18n-base-zh_Hans/Makefile' \
            -print -quit 2>/dev/null | grep -q .; then
            echo "CHINESE_PACKAGE=luci-i18n-base-zh_Hans" >> "$GITHUB_ENV"
          else
            echo "CHINESE_PACKAGE=none" >> "$GITHUB_ENV"
            echo "::warning::Chinese base translation package not found."
          fi

      - name: Configure minimal firmware
        working-directory: immortalwrt
        shell: bash
        env:
          PACKAGE_MANAGER_UI: ${{ env.PACKAGE_MANAGER_UI }}
          CHINESE_PACKAGE: ${{ env.CHINESE_PACKAGE }}
        run: |
          set -euo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-light=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-file=y
          CONFIG_PACKAGE_rpcd-mod-iwinfo=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_opkg=y
          EOF

          if [ "$PACKAGE_MANAGER_UI" = "yes" ]; then
            echo 'CONFIG_PACKAGE_luci-app-package-manager=y' >> .config
          fi

          if [ "$CHINESE_PACKAGE" != "none" ]; then
            echo "CONFIG_PACKAGE_${CHINESE_PACKAGE}=y" >> .config
          fi

          make defconfig

          echo "=== Target configuration ==="
          grep -E '^CONFIG_TARGET_(qualcommax|qualcommax_ipq807x|qualcommax_ipq807x_DEVICE_hisense_hnr101)=' .config || true

          echo "=== Selected LuCI packages ==="
          grep -E '^CONFIG_PACKAGE_(luci|luci-base|luci-light|luci-ssl|luci-compat|luci-theme-bootstrap|luci-app-package-manager|luci-i18n-base-zh-cn|luci-i18n-base-zh_Hans|opkg)=' .config || true

          grep -qx 'CONFIG_TARGET_qualcommax=y' .config
          grep -qx 'CONFIG_TARGET_qualcommax_ipq807x=y' .config
          grep -qx 'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y' .config
          grep -qx 'CONFIG_PACKAGE_luci=y' .config

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-luci-language <<'EOF'
          #!/bin/sh
          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci
          exit 0
          EOF

          chmod 0755 files/etc/uci-defaults/99-luci-language

      - name: Download package sources
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail
          make download -j"$(nproc)" V=s

      - name: Prepare target kernel
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail
          make target/linux/prepare V=s

          KERNEL_DIR="$(
            find build_dir -mindepth 2 -maxdepth 2 \
              -type d \
              -path '*/linux-qualcommax_ipq807x/linux-6.12*' \
              -print -quit
          )"

          if [ -z "$KERNEL_DIR" ] || [ ! -f "$KERNEL_DIR/Makefile" ]; then
            echo "::error::Could not locate Linux kernel source root."
            find build_dir -type f \
              -path '*/linux-qualcommax_ipq807x/linux-6.12*/Makefile' \
              -print | head -n 30 || true
            exit 1
          fi

          echo "Kernel directory: $KERNEL_DIR"

          # A kernel .config may not exist immediately after prepare.
          # Do not mistake a subdirectory Makefile for the kernel root.
          if [ ! -f "$KERNEL_DIR/.config" ]; then
            echo "::notice::Kernel .config not generated by prepare; inspecting target config."

            find target/linux/qualcommax -maxdepth 3 -type f \
              \( -name 'config-6.12' -o -name '*config*' \) \
              -print

            # Ask the OpenWrt build system to configure the kernel.
            make target/linux/config V=s

          fi

          if [ ! -f "$KERNEL_DIR/.config" ]; then
            echo "::error::Kernel .config is still missing; cannot run olddefconfig."
            exit 1
          fi

          # Synchronize newly introduced Kconfig symbols without a TTY.
          make -C "$KERNEL_DIR" ARCH=arm64 olddefconfig

          echo "=== Relevant kernel configuration ==="
          grep -E \
            '^(CONFIG_NF_CONNTRACK_DSCPREMARK_EXT|CONFIG_NF_CONNTRACK|CONFIG_TRANSPARENT_HUGEPAGE|CONFIG_ARM64_CONTPTE)=' \
            "$KERNEL_DIR/.config" || true

      - name: Compile firmware
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)" V=s

      - name: List generated firmware
        if: success()
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail

          OUT="bin/targets/qualcommax/ipq807x"
          if [ ! -d "$OUT" ]; then
            echo "::error::Firmware output directory not found: $OUT"
            find bin/targets -maxdepth 4 -type f -print || true
            exit 1
          fi

          find "$OUT" -maxdepth 2 -type f \
            \( -name '*.bin' -o -name '*.ubi' -o -name '*.itb' \
            -o -name '*.img' -o -name '*.manifest' \
            -o -name 'sha256sums' \) \
            -print

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-hnr101-${{ github.run_number }}
          path: |
            immortalwrt/bin/targets/qualcommax/ipq807x/
            !immortalwrt/bin/targets/qualcommax/ipq807x/packages/
          if-no-files-found: error
          retention-days: 14

      - name: Upload configuration for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hnr101-build-debug-${{ github.run_number }}
          path: |
            immortalwrt/.config
            immortalwrt/build_dir/target-aarch64_cortex-a53_musl/linux-qualcommax_ipq807x/linux-6.12.80/.config
          if-no-files-found: ignore
          retention-days: 7
