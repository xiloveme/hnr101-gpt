name: Build ImmortalWrt for Hisense HNR101

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hnr101-build.yml"
  schedule:
    - cron: "0 18 * * 5"

permissions:
  contents: read

concurrency:
  group: hnr101-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build HNR101 Minimal Chinese Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      REPO_URL: https://github.com/sqliuchang/immortalwrt.git
      REPO_COMMIT: af7729479ddf19fecac5872fb89344958832ab12
      BUILD_DIR: immortalwrt

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pyelftools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ca-certificates \
            perl \
            cpio \
            ecj \
            fastjar \
            java-propose-classpath \
            libelf-dev \
            device-tree-compiler \
            qemu-utils \
            time

      - name: Clone pinned ImmortalWrt source
        run: |
          set -euo pipefail
          git clone "$REPO_URL" "$BUILD_DIR"
          cd "$BUILD_DIR"
          git checkout --detach "$REPO_COMMIT"
          echo "Source commit:"
          git rev-parse HEAD

      - name: Remove optional third-party feed entries
        working-directory: immortalwrt
        run: |
          set -euo pipefail

          # Do not add iStore or OpenClash feeds.
          # Remove matching optional entries if they exist in this checkout.
          if [ -f feeds.conf.default ]; then
            sed -i '/istore/d;/openclash/d' feeds.conf.default
          fi

          echo "Configured feeds:"
          cat feeds.conf.default

      - name: Update feeds
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a

      - name: Install only required LuCI packages
        working-directory: immortalwrt
        run: |
          set -euo pipefail

          # Install LuCI core, Chinese translation, HTTPS support,
          # compatibility libraries and the built-in package manager.
          ./scripts/feeds install -p luci \
            luci \
            luci-base \
            luci-light \
            luci-ssl \
            luci-compat \
            luci-mod-admin-full \
            luci-theme-bootstrap \
            luci-i18n-base-zh-cn \
            luci-app-package-manager

      - name: Create minimal HNR101 configuration
        working-directory: immortalwrt
        run: |
          set -euo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y

          # Package manager
          CONFIG_PACKAGE_opkg=y

          # LuCI web interface
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-light=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          # Chinese language
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          # Online package installation through LuCI
          CONFIG_PACKAGE_luci-app-package-manager=y
          EOF

          # Set Chinese as the default LuCI language on first boot.
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-luci-language <<'EOF'
          #!/bin/sh
          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-luci-language

      - name: Resolve configuration
        working-directory: immortalwrt
        run: |
          set -euo pipefail

          make defconfig

          echo "=== Target ==="
          grep -E '^CONFIG_TARGET_qualcommax(_ipq807x)?=|^CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=' .config || true

          echo "=== Required packages ==="
          grep -E '^CONFIG_PACKAGE_(opkg|luci|luci-base|luci-light|luci-ssl|luci-compat|luci-mod-admin-full|luci-theme-bootstrap|luci-i18n-base-zh-cn|luci-app-package-manager)=' .config || true

          echo "=== Validate required configuration ==="
          required_symbols=(
            CONFIG_TARGET_qualcommax=y
            CONFIG_TARGET_qualcommax_ipq807x=y
            CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y
            CONFIG_PACKAGE_opkg=y
            CONFIG_PACKAGE_luci=y
            CONFIG_PACKAGE_luci-ssl=y
            CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
            CONFIG_PACKAGE_luci-app-package-manager=y
          )

          for symbol in "${required_symbols[@]}"; do
            if ! grep -Fxq "$symbol" .config; then
              echo "::error::Required configuration missing: $symbol"
              exit 1
            fi
          done

          echo "=== Verify excluded plugins ==="
          if grep -Eq '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-store)=(y|m)$' .config; then
            echo "::error::An excluded plugin is enabled"
            exit 1
          fi

          echo "Configuration validation passed."

      - name: Download source packages
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          make download -j"$(nproc)" V=s

      - name: Compile firmware
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" V=s

      - name: List firmware images
        if: success()
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          echo "=== Firmware files ==="
          find bin/targets/qualcommax/ipq807x \
            -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.ubi' -o -name '*.img' -o -name '*.itb' -o -name '*.manifest' -o -name '*.buildinfo' \) \
            -print

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-HNR101-Minimal-Chinese
          path: |
            immortalwrt/bin/targets/qualcommax/ipq807x/*.bin
            immortalwrt/bin/targets/qualcommax/ipq807x/*.ubi
            immortalwrt/bin/targets/qualcommax/ipq807x/*.img
            immortalwrt/bin/targets/qualcommax/ipq807x/*.itb
            immortalwrt/bin/targets/qualcommax/ipq807x/*.manifest
            immortalwrt/bin/targets/qualcommax/ipq807x/*.buildinfo
          if-no-files-found: error
          compression-level: 1
