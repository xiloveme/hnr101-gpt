
name: Build ImmortalWrt for Hisense HNR101

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hnr101-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: HNR101 Chinese LuCI + iStore + OpenClash
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      REPO_URL: https://github.com/sqliuchang/immortalwrt.git
      REPO_COMMIT: af7729479ddf19fecac5872fb89344958832ab12
      TZ: Asia/Shanghai

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-distutils \
            python3-setuptools python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl \
            cpio ecj fastjar java-propose-classpath \
            libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev \
            libreadline-dev libtool libyaml-dev \
            patch pkgconf qemu-utils squashfs-tools \
            subversion swig time xsltproc zstd

      - name: Clone HNR101 source
        run: |
          git clone "$REPO_URL" immortalwrt
          cd immortalwrt

          git fetch origin "$REPO_COMMIT"
          git checkout --detach "$REPO_COMMIT"

          git log -1 --oneline

      - name: Verify HNR101 device files
        run: |
          cd immortalwrt

          test -f target/linux/qualcommax/dts/ipq8072-hnr101.dts
          test -f target/linux/qualcommax/image/ipq807x.mk
          test -f package/firmware/ipq-wifi/src/board-hisense_hnr101.ipq8074

          echo "HNR101 device support verified."

      - name: Add iStore feed
        run: |
          cd immortalwrt

          grep -q 'src-git istore ' feeds.conf.default || \
            echo 'src-git istore https://github.com/linkease/istore;main' \
            >> feeds.conf.default

      - name: Fetch OpenClash source
        run: |
          cd immortalwrt

          mkdir -p package/luci-app-openclash

          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/vernesong/OpenClash.git \
            package/luci-app-openclash

          cd package/luci-app-openclash
          git sparse-checkout set luci-app-openclash

          test -f luci-app-openclash/Makefile

      - name: Update and install feeds
        run: |
          cd immortalwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          ./scripts/feeds update istore
          ./scripts/feeds install -d y -p istore luci-app-store

      - name: Generate HNR101 configuration
        run: |
          cd immortalwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y

          # LuCI Chinese interface
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_LUCI_LANG_zh_Hans=y

          # iStore app store
          CONFIG_PACKAGE_luci-app-store=y

          # OpenClash LuCI application
          CONFIG_PACKAGE_luci-app-openclash=y

          # OpenClash common runtime dependencies
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          # Utilities
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_ethtool=y

          # USB storage support
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-nls-utf8=y
          EOF

          make defconfig

          grep -E \
            'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101|CONFIG_PACKAGE_luci-app-store|CONFIG_PACKAGE_luci-app-openclash|CONFIG_PACKAGE_luci-i18n-base-zh-cn' \
            .config || true

          grep -qx \
            'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y' \
            .config || {
              echo "ERROR: HNR101 target profile is missing."
              exit 1
            }

          grep -qx 'CONFIG_PACKAGE_luci-app-store=y' .config || {
            echo "ERROR: iStore package is not selected."
            exit 1
          }

          grep -qx 'CONFIG_PACKAGE_luci-app-openclash=y' .config || {
            echo "ERROR: OpenClash package is not selected."
            exit 1
          }

      - name: Download sources
        run: |
          cd immortalwrt
          make download -j2
        timeout-minutes: 120

      - name: Compile firmware
        run: |
          cd immortalwrt
          make -j2 V=s
        timeout-minutes: 300

      - name: Verify firmware output
        if: success()
        run: |
          cd immortalwrt

          TARGET="bin/targets/qualcommax/ipq807x"

          test -d "$TARGET"

          find "$TARGET" -maxdepth 2 -type f -print

          test -n "$(find "$TARGET" -type f \
            \( -name '*.bin' -o -name '*.ubi' \
            -o -name '*.img' -o -name '*.itb' \) \
            -print -quit)" || {
              echo "ERROR: No firmware image found."
              exit 1
            }

          if [ -f "$TARGET"/*.manifest ]; then
            grep -iE 'luci-app-store|luci-app-openclash|luci-i18n-base-zh-cn' \
              "$TARGET"/*.manifest || true
          fi

      - name: Save build information
        if: always()
        run: |
          mkdir -p build-info

          if [ -f immortalwrt/.config ]; then
            cp immortalwrt/.config build-info/config.txt
          fi

          git -C immortalwrt rev-parse HEAD \
            > build-info/source-commit.txt 2>/dev/null || true

          if [ -d immortalwrt/bin/targets/qualcommax/ipq807x ]; then
            cp immortalwrt/bin/targets/qualcommax/ipq807x/*.manifest \
              build-info/ 2>/dev/null || true

            cp immortalwrt/bin/targets/qualcommax/ipq807x/sha256sums \
              build-info/ 2>/dev/null || true
          fi

      - name: Upload HNR101 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-HNR101-CN-iStore-OpenClash-${{ github.run_number }}
          path: |
            immortalwrt/bin/targets/qualcommax/ipq807x/
            build-info/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HNR101-build-diagnostics-${{ github.run_number }}
          path: |
            immortalwrt/.config
            immortalwrt/logs/
            build-info/
          if-no-files-found: ignore
          retention-days: 7
