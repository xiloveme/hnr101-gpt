name: LibWrt HNR101 Minimal Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hnr101-libwrt.yml"

permissions:
  contents: read

concurrency:
  group: libwrt-hnr101-build
  cancel-in-progress: false

jobs:
  build:
    name: Build LibWrt for Hisense HNR101
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ack asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang \
            cmake cpio curl device-tree-compiler flex gawk \
            gettext git gnutls-dev gperf libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev \
            libz-dev lld llvm make patch perl python3 \
            python3-setuptools qemu-utils rsync unzip wget \
            xsltproc zlib1g-dev file findutils jq

      - name: Clone LibWrt
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --branch 25.12-nss \
            --single-branch \
            https://github.com/LiBwrt/LibWrt.git \
            libwrt

          cd libwrt

          echo "=== LibWrt revision ==="
          git log -1 --oneline
          echo "LIBWRT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fetch HNR101 support commit
        working-directory: libwrt
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_COMMIT="af7729479ddf19fecac5872fb89344958832ab12"
          SOURCE_REPO="https://github.com/sqliuchang/immortalwrt.git"

          git fetch --no-tags "$SOURCE_REPO" "$SOURCE_COMMIT"

          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git cat-file -e "${SOURCE_COMMIT}^1^{commit}"

          echo "=== HNR101 source commit ==="
          git show --no-patch --format=fuller "$SOURCE_COMMIT"

          echo "=== Files changed by HNR101 commit ==="
          git diff-tree --no-commit-id --name-status -r "$SOURCE_COMMIT"

      - name: Port HNR101 device support
        working-directory: libwrt
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_COMMIT="af7729479ddf19fecac5872fb89344958832ab12"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git diff --binary \
            "${SOURCE_COMMIT}^1" \
            "$SOURCE_COMMIT" \
            > /tmp/hnr101-support.patch

          echo "=== Applying HNR101 support as a three-way patch ==="

          if ! git apply --3way --index /tmp/hnr101-support.patch; then
            echo "::error::HNR101 patch has conflicts with LibWrt. Review the conflict details below."
            git status --short || true
            git diff --cc || true
            exit 1
          fi

          echo "=== Confirm device files ==="

          test -f target/linux/qualcommax/dts/ipq8072-hnr101.dts
          grep -q 'hisense_hnr101' \
            target/linux/qualcommax/image/ipq807x.mk

          git status --short

      - name: Update feeds
        working-directory: libwrt
        shell: bash
        run: |
          set -euo pipefail

          # Do not add third-party feeds.
          # Remove any pre-existing iStore/OpenClash feed entries.
          for f in feeds.conf feeds.conf.default; do
            if [ -f "$f" ]; then
              sed -i \
                -e '/istore/d' \
                -e '/openclash/d' \
                "$f"
            fi
          done

          ./scripts/feeds update -a

      - name: Install LuCI
        working-directory: libwrt
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds install luci

          if find package feeds -type f \
            -path '*/luci-i18n-base-zh-cn/Makefile' \
            -print -quit 2>/dev/null | grep -q .; then
            ./scripts/feeds install luci-i18n-base-zh-cn
            echo "CHINESE_PACKAGE=luci-i18n-base-zh-cn" >> "$GITHUB_ENV"
          else
            echo "::warning::luci-i18n-base-zh-cn was not found."
            echo "CHINESE_PACKAGE=none" >> "$GITHUB_ENV"
          fi

          if find package feeds -type f \
            -path '*/luci-app-package-manager/Makefile' \
            -print -quit 2>/dev/null | grep -q .; then
            ./scripts/feeds install luci-app-package-manager
            echo "PACKAGE_MANAGER_UI=yes" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_MANAGER_UI=no" >> "$GITHUB_ENV"
            echo "::notice::No separate luci-app-package-manager package found; using the branch's available package management facilities."
          fi

      - name: Configure HNR101 minimal firmware
        working-directory: libwrt
        shell: bash
        env:
          CHINESE_PACKAGE: ${{ env.CHINESE_PACKAGE }}
          PACKAGE_MANAGER_UI: ${{ env.PACKAGE_MANAGER_UI }}
        run: |
          set -euo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          EOF

          if [ "$CHINESE_PACKAGE" != "none" ]; then
            echo "CONFIG_PACKAGE_${CHINESE_PACKAGE}=y" >> .config
          fi

          if [ "$PACKAGE_MANAGER_UI" = "yes" ]; then
            echo 'CONFIG_PACKAGE_luci-app-package-manager=y' >> .config
          fi

          # Let this LibWrt branch select its native package manager.
          # Do not force opkg on a branch that may use apk.
          make defconfig

          echo "=== Target selection ==="
          grep -E '^CONFIG_TARGET_(qualcommax|qualcommax_ipq807x|qualcommax_ipq807x_DEVICE_hisense_hnr101)=' .config || true

          echo "=== Selected packages ==="
          grep -E '^CONFIG_PACKAGE_(luci|luci-ssl|luci-theme-bootstrap|luci-i18n-base-zh-cn|luci-app-package-manager|opkg|apk)=' .config || true

          grep -qx 'CONFIG_TARGET_qualcommax=y' .config
          grep -qx 'CONFIG_TARGET_qualcommax_ipq807x=y' .config
          grep -qx 'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y' .config
          grep -qx 'CONFIG_PACKAGE_luci=y' .config

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-luci-language <<'EOF'
          #!/bin/sh
          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci
          exit 0
          EOF

          chmod 0755 files/etc/uci-defaults/99-luci-language

      - name: Verify HNR101 image definition
        working-directory: libwrt
        shell: bash
        run: |
          set -euo pipefail

          grep -n -A 12 -B 4 'hisense_hnr101' \
            target/linux/qualcommax/image/ipq807x.mk

          echo "=== HNR101 DTS model and compatibility ==="
          grep -n -E 'model|compatible|rootfs|partition|bootargs' \
            target/linux/qualcommax/dts/ipq8072-hnr101.dts || true

      - name: Download sources
        working-directory: libwrt
        shell: bash
        run: |
          set -euo pipefail
          make download -j"$(nproc)" V=s

      - name: Compile firmware
        working-directory: libwrt
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)" V=s

      - name: List firmware images
        if: success()
        working-directory: libwrt
        shell: bash
        run: |
          set -euo pipefail

          OUT="bin/targets/qualcommax/ipq807x"

          if [ ! -d "$OUT" ]; then
            echo "::error::Expected firmware directory not found: $OUT"
            find bin/targets -maxdepth 4 -type f -print || true
            exit 1
          fi

          find "$OUT" -maxdepth 2 -type f \
            \( -name '*.bin' -o -name '*.ubi' -o -name '*.itb' \
            -o -name '*.img' -o -name '*.manifest' \
            -o -name 'sha256sums' \) \
            -print

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libwrt-hnr101-${{ github.run_number }}
          path: |
            libwrt/bin/targets/qualcommax/ipq807x/
            !libwrt/bin/targets/qualcommax/ipq807x/packages/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libwrt-hnr101-debug-${{ github.run_number }}
          path: |
            libwrt/.config
            libwrt/tmp/.config-package.in
          if-no-files-found: ignore
          retention-days: 7
