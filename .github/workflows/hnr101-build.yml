name: Build ImmortalWrt for Hisense HNR101

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hnr101-build.yml"
  schedule:
    - cron: "0 18 * * 5"

permissions:
  contents: read

concurrency:
  group: hnr101-hnr101-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build HNR101 firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      REPO_URL: https://github.com/sqliuchang/immortalwrt.git
      REPO_COMMIT: af7729479ddf19fecac5872fb89344958832ab12
      BUILD_DIR: immortalwrt

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -e
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-dev \
            python3-setuptools \
            python3-pip \
            python3-yaml \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            jq \
            time \
            perl \
            xsltproc \
            ca-certificates \
            ccache
          git --version
          python3 --version

      - name: Clone ImmortalWrt at pinned commit
        run: |
          set -euo pipefail
          git clone "$REPO_URL" "$BUILD_DIR"
          cd "$BUILD_DIR"
          git checkout --detach "$REPO_COMMIT"

          echo "Repository: $(git remote get-url origin)"
          echo "Commit: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$REPO_COMMIT"

      - name: Verify HNR101 target support
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"

          DTS="target/linux/qualcommax/dts/ipq8072-hnr101.dts"
          IMAGE_MK="target/linux/qualcommax/image/ipq807x.mk"

          if [ ! -f "$DTS" ]; then
            echo "::error::HNR101 DTS not found: $DTS"
            find target/linux/qualcommax -iname '*hnr101*' -print || true
            exit 1
          fi

          if [ ! -f "$IMAGE_MK" ]; then
            echo "::error::IPQ807x image definition not found"
            exit 1
          fi

          grep -RniE 'hisense.hnr101|hnr101' \
            target/linux/qualcommax 2>/dev/null | head -100 || true

          echo "Checking related calibration and board files..."
          find package/firmware target/linux/qualcommax \
            \( -iname '*hnr101*' -o -iname '*hisense*' \) \
            -print 2>/dev/null | head -100 || true

      - name: Configure iStore feed
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"

          if ! grep -qE '^[[:space:]]*src-git[[:space:]]+istore[[:space:]]' \
            feeds.conf.default; then
            echo 'src-git istore https://github.com/linkease/istore;main' \
              >> feeds.conf.default
          fi

          grep -E '^[[:space:]]*src-git[[:space:]]+istore[[:space:]]' \
            feeds.conf.default

      - name: Update package feeds
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"

          ./scripts/feeds update -a

          test -d feeds/luci || {
            echo "::error::LuCI feed was not downloaded"
            exit 1
          }

          test -d feeds/istore || {
            echo "::error::iStore feed was not downloaded"
            find feeds -maxdepth 2 -type d -print | head -100 || true
            exit 1
          }

      - name: Install required LuCI and iStore packages
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"

          # Install only required LuCI packages, not the entire LuCI feed.
          ./scripts/feeds install -d y -p luci \
            luci-base \
            luci-ssl \
            luci-compat \
            luci-mod-admin-full \
            luci-theme-bootstrap \
            luci-i18n-base-zh-cn

          # Install iStore and its declared dependencies.
          ./scripts/feeds install -d y -p istore luci-app-store

          echo "Checking installed package Makefiles..."
          find package/feeds -maxdepth 4 \
            \( -path '*/luci-base/Makefile' \
            -o -path '*/luci-ssl/Makefile' \
            -o -path '*/luci-compat/Makefile' \
            -o -path '*/luci-app-store/Makefile' \) \
            -print

          test -f package/feeds/istore/luci-app-store/Makefile || {
            echo "::error::iStore package Makefile is missing"
            find feeds/istore package/feeds/istore \
              -path '*/luci-app-store/Makefile' -print 2>/dev/null || true
            exit 1
          }

          echo "iStore Makefile:"
          sed -n '1,180p' package/feeds/istore/luci-app-store/Makefile

      - name: Add OpenClash package
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"

          git clone --depth=1 \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash

          test -f /tmp/OpenClash/luci-app-openclash/Makefile || {
            echo "::error::OpenClash package Makefile not found"
            find /tmp/OpenClash -maxdepth 4 -name Makefile -print \
              | head -100 || true
            exit 1
          }

          mkdir -p package/custom
          rm -rf package/custom/luci-app-openclash
          cp -a /tmp/OpenClash/luci-app-openclash \
            package/custom/luci-app-openclash

          test -f package/custom/luci-app-openclash/Makefile

          echo "OpenClash package installed."
          grep -nE 'LUCI_TITLE|LUCI_DEPENDS|define Package' \
            package/custom/luci-app-openclash/Makefile | head -40 || true

      - name: Prepare HNR101 configuration
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y

          CONFIG_DEVEL=y
          CONFIG_CCACHE=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          CONFIG_PACKAGE_opkg=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_tar=y
          CONFIG_PACKAGE_mount-utils=y
          CONFIG_PACKAGE_libuci-lua=y

          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-openclash=y

          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_coreutils-nohup=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_ruby=y

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-iso8859-1=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_lsblk=y
          EOF

          echo "Initial package configuration:"
          grep -E \
            '^(CONFIG_TARGET_.*hnr101|CONFIG_PACKAGE_(opkg|luci|luci-ssl|luci-compat|luci-i18n-base-zh-cn|luci-app-store|luci-app-openclash))=' \
            .config || true

      - name: Resolve and diagnose Kconfig
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"

          set +e
          make defconfig V=s 2>&1 | tee /tmp/hnr101-defconfig.log
          DEFCONFIG_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$DEFCONFIG_STATUS" -ne 0 ]; then
            echo "::error::make defconfig failed"
            tail -200 /tmp/hnr101-defconfig.log || true
            exit "$DEFCONFIG_STATUS"
          fi

          echo "=== Final configuration ==="
          grep -E \
            '^(CONFIG_TARGET_.*hnr101|CONFIG_PACKAGE_(opkg|luci|luci-ssl|luci-compat|luci-i18n-base-zh-cn|luci-app-store|luci-app-openclash))=' \
            .config || true

          echo "=== Recursive dependency errors ==="
          grep -n -B3 -A8 'recursive dependency detected' \
            /tmp/hnr101-defconfig.log || true

          # Confirm the generated Kconfig includes the iStore symbol.
          if [ ! -f tmp/.config-package.in ]; then
            echo "::error::Generated package Kconfig not found"
            exit 1
          fi

          LINE=$(grep -nE \
            '^[[:space:]]*config[[:space:]]+PACKAGE_luci-app-store([[:space:]]|$)' \
            tmp/.config-package.in | head -1 | cut -d: -f1 || true)

          if [ -z "$LINE" ]; then
            echo "::error::iStore symbol missing from generated Kconfig"
            grep -Rni 'luci-app-store' \
              feeds/istore package/feeds/istore tmp 2>/dev/null \
              | head -150 || true
            exit 1
          fi

          echo "=== iStore Kconfig definition ==="
          END=$((LINE + 45))
          sed -n "${LINE},${END}p" tmp/.config-package.in

          echo "=== iStore package dependencies ==="
          grep -nE 'luci-app-store|luci-lib-taskd|curl|mount-utils' \
            tmp/.packagedeps | head -100 || true

          # Do not silently accept a missing required package.
          REQUIRED_CONFIGS=(
            "CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y"
            "CONFIG_PACKAGE_opkg=y"
            "CONFIG_PACKAGE_luci=y"
            "CONFIG_PACKAGE_luci-ssl=y"
            "CONFIG_PACKAGE_luci-compat=y"
            "CONFIG_LUCI_LANG_zh_Hans=y"
            "CONFIG_PACKAGE_luci-app-openclash=y"
            "CONFIG_PACKAGE_luci-app-store=y"
          )

          for entry in "${REQUIRED_CONFIGS[@]}"; do
            if ! grep -qxF "$entry" .config; then
              echo "::error::Required configuration is missing: $entry"

              if [ "$entry" = "CONFIG_PACKAGE_luci-app-store=y" ]; then
                echo "=== iStore Makefile ==="
                sed -n '1,200p' \
                  package/feeds/istore/luci-app-store/Makefile || true

                echo "=== iStore Kconfig context ==="
                grep -n -B8 -A45 'config PACKAGE_luci-app-store' \
                  tmp/.config-package.in || true

                echo "=== iStore references ==="
                grep -Rni 'luci-app-store' \
                  feeds/istore package/feeds/istore tmp 2>/dev/null \
                  | head -150 || true
              fi

              echo "=== Kconfig errors and warnings ==="
              grep -niE \
                'recursive dependency|luci-app-store|dependency detected|error:' \
                /tmp/hnr101-defconfig.log | tail -200 || true

              exit 1
            fi
          done

          echo "All required configuration options are enabled."

      - name: Download source packages
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          make download -j4

      - name: Compile firmware
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"

          echo "Starting HNR101 firmware build..."
          echo "CPU count: $(nproc)"
          free -h
          df -h

          make -j2 V=s

      - name: Verify generated firmware
        if: success()
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"

          OUTPUT_DIR="bin/targets/qualcommax/ipq807x"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "::error::Firmware output directory not found: $OUTPUT_DIR"
            find bin/targets -maxdepth 4 -type f -print 2>/dev/null \
              | head -200 || true
            exit 1
          fi

          echo "Generated files:"
          find "$OUTPUT_DIR" -maxdepth 2 -type f \
            -printf '%p (%s bytes)\n'

          if ! find "$OUTPUT_DIR" -maxdepth 2 -type f \
            \( -iname '*hnr101*' -o -iname '*hisense*' \) | grep -q .; then
            echo "::error::No HNR101/Hisense-named firmware file found"
            echo "Available image files:"
            find "$OUTPUT_DIR" -maxdepth 2 -type f \
              \( -iname '*.bin' -o -iname '*.img' -o -iname '*.itb' \
                 -o -iname '*.ubi' -o -iname '*.tar' \) -print
            exit 1
          fi

          echo "Firmware output check passed."

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-hnr101-${{ github.run_number }}
          path: immortalwrt/bin/targets/qualcommax/ipq807x/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hnr101-build-diagnostics-${{ github.run_number }}
          path: |
            /tmp/hnr101-defconfig.log
            immortalwrt/.config
            immortalwrt/tmp/.config-package.in
            immortalwrt/tmp/.packagedeps
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
