name: Build ImmortalWrt for Hisense HNR101

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hnr101-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: HNR101 Chinese LuCI + iStore + OpenClash
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      REPO_URL: https://github.com/sqliuchang/immortalwrt.git
      REPO_COMMIT: af7729479ddf19fecac5872fb89344958832ab12
      TZ: Asia/Shanghai
      BUILD_JOBS: "2"

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync unzip zlib1g-dev \
            file wget curl cpio ecj fastjar \
            java-propose-classpath libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libreadline-dev libtool libyaml-dev \
            patch pkgconf qemu-utils squashfs-tools \
            subversion swig time xsltproc zstd

      - name: Clone pinned HNR101 source
        run: |
          git clone "$REPO_URL" immortalwrt
          cd immortalwrt

          git fetch origin "$REPO_COMMIT"
          git checkout --detach "$REPO_COMMIT"

          test "$(git rev-parse HEAD)" = "$REPO_COMMIT"

          echo "Source commit:"
          git log -1 --format='%H%n%s'

      - name: Verify HNR101 device support
        run: |
          cd immortalwrt

          test -f target/linux/qualcommax/dts/ipq8072-hnr101.dts
          test -f target/linux/qualcommax/image/ipq807x.mk
          test -f package/firmware/ipq-wifi/src/board-hisense_hnr101.ipq8074

          grep -Rni 'hisense_hnr101' \
            target/linux/qualcommax \
            package/firmware/ipq-wifi

          echo "HNR101 device files verified."

      - name: Configure iStore feed
        run: |
          cd immortalwrt

          if ! grep -qE '^src-git istore ' feeds.conf.default; then
            echo 'src-git istore https://github.com/linkease/istore;main' \
              >> feeds.conf.default
          fi

          cat feeds.conf.default

      - name: Update package feeds
        run: |
          cd immortalwrt

          ./scripts/feeds update -a

          echo "Available feeds:"
          ./scripts/feeds list -n

      - name: Install required feed packages
        run: |
          cd immortalwrt

          # 安装 LuCI feed。这里不盲目安装所有 feed，
          # 以减少无关软件包引入的 Kconfig 依赖风险。
          ./scripts/feeds install -a -p luci

          # 安装 iStore 及其 feed 中可解析的依赖。
          ./scripts/feeds install -d y -p istore luci-app-store

          # 仅安装需要的可选 LuCI 应用及依赖。
          ./scripts/feeds install -d y luci-app-upnp luci-app-ttyd

          # 检查 iStore 软件包是否实际进入构建树。
          test -f package/feeds/istore/luci-app-store/Makefile || {
            echo "ERROR: luci-app-store Makefile not found."
            exit 1
          }

          # 检查常用插件是否存在；不同分支可能有不同目录布局。
          find package/feeds -type f \
            \( -path '*/luci-app-upnp/Makefile' \
            -o -path '*/luci-app-ttyd/Makefile' \) -print

      - name: Fetch OpenClash source
        run: |
          cd immortalwrt

          # 使用临时克隆目录，避免 Makefile 多嵌套一层。
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/vernesong/OpenClash.git \
            /tmp/OpenClash

          cd /tmp/OpenClash
          git sparse-checkout set luci-app-openclash

          test -f luci-app-openclash/Makefile || {
            echo "ERROR: OpenClash Makefile not found."
            exit 1
          }

          cd "$GITHUB_WORKSPACE/immortalwrt"
          mkdir -p package/custom

          # 固定到标准的 package/custom/luci-app-openclash 路径。
          rm -rf package/custom/luci-app-openclash
          cp -a /tmp/OpenClash/luci-app-openclash \
            package/custom/luci-app-openclash

          test -f package/custom/luci-app-openclash/Makefile

          echo "OpenClash source revision:"
          git -C /tmp/OpenClash rev-parse HEAD

      - name: Check package definitions
        run: |
          cd immortalwrt

          echo "Checking opkg source availability..."

          if ! grep -RqsE \
            '(^define Package/opkg|^Package/opkg|CONFIG_PACKAGE_opkg)' \
            package/system/opkg package/system 2>/dev/null; then
            echo "WARNING: opkg definition was not found at the expected paths."
            echo "The selected source branch may use another package layout."
          fi

          echo "Checking LuCI language configuration..."
          grep -Rns 'LUCI_LANG_zh_Hans' \
            feeds/luci package/feeds/luci \
            2>/dev/null || true

          echo "Checking for the previous WPE WebKit dependency issue..."
          grep -RnsE \
            'PACKAGE_wpewebkit-minibrowser|wpewebkit-minibrowser' \
            package feeds target 2>/dev/null || true

      - name: Generate HNR101 configuration
        run: |
          cd immortalwrt

          # 当前为全新克隆。生成一份统一的初始配置。
          rm -f .config

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq807x=y
          CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y

          # LuCI and Chinese language
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_LUCI_LANG_zh_Hans=y

          # Package manager: this build expects the opkg-based source branch
          CONFIG_PACKAGE_opkg=y
          CONFIG_PER_FEED_REPO=y
          CONFIG_PER_FEED_REPO_ADD_VERSION=y

          # iStore
          CONFIG_PACKAGE_luci-app-store=y

          # OpenClash
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          # Common LuCI applications
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-ttyd=y

          # Network tools
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_ethtool=y

          # USB 3.0 and storage
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-nls-utf8=y
          EOF

          # 先解析 Kconfig，任何递归依赖错误都必须让构建失败。
          make defconfig V=s 2>&1 | tee /tmp/hnr101-defconfig.log

      - name: Validate resolved configuration
        run: |
          cd immortalwrt

          echo "Resolved target and package options:"
          grep -E \
            'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=|CONFIG_PACKAGE_(opkg|luci|luci-ssl|luci-compat|luci-app-store|luci-app-openclash)=|CONFIG_LUCI_LANG_zh_Hans=' \
            .config || true

          require_config() {
            if ! grep -qx "$1" .config; then
              echo "ERROR: Required configuration is missing: $1"
              exit 1
            fi
          }

          require_config \
            'CONFIG_TARGET_qualcommax_ipq807x_DEVICE_hisense_hnr101=y'

          require_config 'CONFIG_PACKAGE_luci=y'
          require_config 'CONFIG_PACKAGE_luci-app-store=y'
          require_config 'CONFIG_PACKAGE_luci-app-openclash=y'
          require_config 'CONFIG_LUCI_LANG_zh_Hans=y'
          require_config 'CONFIG_PACKAGE_opkg=y'

          # 归档解析后的配置，方便构建失败时定位。
          mkdir -p logs
          cp .config logs/resolved.config

      - name: Download sources
        run: |
          cd immortalwrt
          mkdir -p logs
          set -o pipefail
          make download -j2 V=s 2>&1 | tee logs/download.log
        timeout-minutes: 120

      - name: Compile firmware
        run: |
          cd immortalwrt
          mkdir -p logs
          set -o pipefail
          make -j"$BUILD_JOBS" V=s 2>&1 | tee logs/build.log
        timeout-minutes: 300

      - name: Verify firmware output
        if: success()
        run: |
          cd immortalwrt

          TARGET="bin/targets/qualcommax/ipq807x"

          test -d "$TARGET" || {
            echo "ERROR: Expected target directory not found: $TARGET"
            exit 1
          }

          echo "Firmware files:"
          find "$TARGET" -maxdepth 2 -type f -print

          IMAGE="$(find "$TARGET" -maxdepth 2 -type f \
            \( -name '*.bin' -o -name '*.ubi' \
            -o -name '*.img' -o -name '*.itb' \) \
            -print -quit)"

          if [ -z "$IMAGE" ]; then
            echo "ERROR: No firmware image found."
            exit 1
          fi

          echo "Found firmware image: $IMAGE"

          # 检查清单，避免将配置选中误当成已打包。
          MANIFESTS="$(find "$TARGET" -maxdepth 1 -type f \
            -name '*.manifest' -print)"

          if [ -z "$MANIFESTS" ]; then
            echo "WARNING: No manifest file found."
          else
            while IFS= read -r manifest; do
              echo "Checking manifest: $manifest"

              grep -iE \
                '(^|[[:space:]])(opkg|luci|luci-app-store|luci-app-openclash|luci-i18n-base-zh-cn)([[:space:]]|$)' \
                "$manifest" || true
            done <<EOF
          $MANIFESTS
          EOF
          fi

          # 必须有包清单才能进一步确认包是否进入固件。
          # 如果某个包未出现，保留清单以供诊断。
          echo "Firmware output verification completed."

      - name: Save build information
        if: always()
        run: |
          mkdir -p build-info

          if [ -d immortalwrt ]; then
            git -C immortalwrt rev-parse HEAD \
              > build-info/source-commit.txt 2>/dev/null || true

            git -C immortalwrt status --short \
              > build-info/source-status.txt 2>/dev/null || true

            if [ -f immortalwrt/.config ]; then
              cp immortalwrt/.config build-info/config.txt
            fi

            if [ -d immortalwrt/bin/targets/qualcommax/ipq807x ]; then
              find immortalwrt/bin/targets/qualcommax/ipq807x \
                -maxdepth 1 -type f -name '*.manifest' \
                -exec cp -f {} build-info/ \; 2>/dev/null || true

              if [ -f immortalwrt/bin/targets/qualcommax/ipq807x/sha256sums ]; then
                cp immortalwrt/bin/targets/qualcommax/ipq807x/sha256sums \
                  build-info/
              fi
            fi

            if [ -d immortalwrt/logs ]; then
              cp -a immortalwrt/logs build-info/
            fi
          fi

          if [ -f /tmp/hnr101-defconfig.log ]; then
            cp /tmp/hnr101-defconfig.log build-info/
          fi

      - name: Upload HNR101 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-HNR101-CN-iStore-OpenClash-${{ github.run_number }}
          path: |
            immortalwrt/bin/targets/qualcommax/ipq807x/
            build-info/
          if-no-files-found: error
          compression-level: 1
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HNR101-build-diagnostics-${{ github.run_number }}
          path: |
            immortalwrt/.config
            immortalwrt/logs/
            build-info/
            /tmp/hnr101-defconfig.log
          if-no-files-found: ignore
          retention-days: 7
